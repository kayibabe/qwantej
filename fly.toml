
# Fly.io configuration for Qwantej
# Docs: https://fly.io/docs/reference/configuration/

app = 'qwantej'
primary_region = 'jnb'   # Johannesburg — closest region to Malawi

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT               = '8000'
  SKIP_STARTUP_SYNC  = 'false'
  APP_URL            = 'https://qwantej.fly.dev'
  CORS_ORIGINS       = 'https://qwantej.fly.dev'

# All sensitive values are set via fly secrets — never committed here.
# Required secrets:
#   fly secrets set JWT_SECRET=<value>
#   fly secrets set DATABASE_URL=<postgres-url>   # set automatically by Fly Postgres add-on
#   fly secrets set API_FOOTBALL_KEY=<value>
#   fly secrets set GROQ_API_KEY=<value>
#   fly secrets set TELEGRAM_BOT_TOKEN=<value>
#   fly secrets set TELEGRAM_FREE_CHAT_ID=<value>
#   fly secrets set TELEGRAM_PRO_CHAT_ID=<value>
#   fly secrets set Qwantej_CLAUDE_KEY=<value>
# Provision Postgres:
#   fly postgres create --name qwantej-db --region jnb
#   fly postgres attach qwantej-db  (sets DATABASE_URL secret automatically)

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = 'off'   # scheduler jobs must keep running 24/7
  auto_start_machines  = true
  min_machines_running = 1       # always one machine up for the cron jobs
  idle_timeout         = 300     # 5 min — backtest endpoint needs > 60s default

  [[http_service.checks]]
    grace_period = '30s'
    interval     = '30s'
    method       = 'GET'
    path         = '/health'
    timeout      = '10s'

[[vm]]
  memory   = '2gb'    # ZINB model fitting (scipy + numpy, 211 leagues) needs headroom
  cpu_kind = 'shared'
  cpus     = 1

# Temporary: keep volume mount during Phase 0 so the SQLite data migration script
# can access /data/Qwantej.db. After running migrate_sqlite_to_postgres.py, remove
# this section and destroy the volume:
#   fly volumes list  →  fly volumes destroy <vol-id>
[[mounts]]
  source      = 'qwantej_data'
  destination = '/data'
