
# Fly.io configuration for Qwantej
# Docs: https://fly.io/docs/reference/configuration/

app = 'qwantej'
primary_region = 'jnb'   # Johannesburg — closest region to Malawi

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT               = '8000'
  SKIP_STARTUP_SYNC  = 'false'
  APP_URL            = 'https://qwantej.fly.dev'
  CORS_ORIGINS       = 'https://qwantej.fly.dev'

# All sensitive values (JWT_SECRET, DB_URL, API keys) are set via:
#   fly secrets set KEY=value ...
# They are NOT stored here.

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = 'off'   # scheduler jobs must keep running 24/7
  auto_start_machines  = true
  min_machines_running = 1       # always one machine up for the cron jobs

  [[http_service.checks]]
    grace_period = '30s'
    interval     = '30s'
    method       = 'GET'
    path         = '/health'
    timeout      = '10s'

[[vm]]
  memory   = '2gb'    # ZINB model fitting (scipy + numpy, 211 leagues) needs headroom
  cpu_kind = 'shared'
  cpus     = 1

# Persistent volume — SQLite DB lives here across deploys
[[mounts]]
  source      = 'qwantej_data'
  destination = '/data'
  initial_size = '1gb'
