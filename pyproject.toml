[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwantej"
version = "0.1.0"
description = "Qwantej Accumulator Intelligence Framework — core domain package (data, models, calibration, value, accumulator, bankroll, performance)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "statsmodels",
    "scikit-learn",
    "pydantic",
    "sqlalchemy",
    "python-dateutil",
]

[project.optional-dependencies]
backend = [
    "fastapi",
    "uvicorn[standard]",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "python-dotenv",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/qwantej", "backend"]
ignore_missing_imports = true
