# Render Blueprint for the Qwantej backend (FastAPI).
#
# autoDeploy is true: the live service (dashboard-verified 2026-09-14)
# deploys automatically the moment a PR merges into main. Because there is
# no manual trigger step to run a migration in between, DEVELOPMENT.md §6
# requires any pending Alembic migration to run against Neon BEFORE the
# merge, not after.
#
# The Postgres database itself is NOT defined here — it lives on Neon, not
# Render. Set DATABASE_URL below to the Neon connection string via the
# Render dashboard's environment group / secret, never committed here.

services:
  - type: web
    name: qwantej
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    rootDir: .
    buildCommand: pip install -e ".[backend]"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_BASE_URL
        value: https://v3.football.api-sports.io
      - key: API_FOOTBALL_TIMEOUT_SECONDS
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_TIMEOUT_SECONDS
        value: "10"
      - key: BACKUP_DIR
        value: backups
      - key: BACKUP_KEEP_COUNT
        value: "7"

  # Persistent scheduler: ingestion, shadow signal pipeline, and settlement,
  # each on its own interval (backend/workers/scheduler.py). This is a
  # long-running process (Ctrl-C/SIGTERM to stop), not a quick one-shot
  # command, so it must be a Background Worker — Render Cron Jobs expect the
  # process to exit each tick, which this never does. Background Workers are
  # not available on Render's free tier.
  - type: worker
    name: qwantej-scheduler
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: false
    rootDir: .
    buildCommand: pip install -e ".[backend]"
    startCommand: python -m backend.workers.scheduler
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_BASE_URL
        value: https://v3.football.api-sports.io
      - key: API_FOOTBALL_TIMEOUT_SECONDS
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_TIMEOUT_SECONDS
        value: "10"
