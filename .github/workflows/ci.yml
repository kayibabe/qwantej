name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qwantej
          POSTGRES_PASSWORD: password
          POSTGRES_DB: qwantej
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qwantej -d qwantej"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://qwantej:password@localhost:5432/qwantej
      ENVIRONMENT: ci
      SECRET_KEY: ci-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[backend,dev]"

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run test suite
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check backend src tests

      - name: Run mypy
        run: python -m mypy backend src

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
